name: Histórico - Diário 22h BRT

on:
  workflow_dispatch:      # permite rodar manualmente
  schedule:
    # 22:00 em America/Sao_Paulo (UTC-3) = 01:00 UTC do dia seguinte
    - cron: "0 1 * * *"

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  # Opcional: desligar formatação nos scripts que suportam essa flag
  DISABLE_FORMATTING: "1"
  PYTHONPATH: .
  HTTP_TIMEOUT: "300"   # ver comentario em esteira.yml
  # Runs observados: 27min a 2h08. 150 min da margem sobre o pior caso real e
  # ainda garante resumo antes do kill. Nota: este workflow compartilha o grupo
  # de concurrency com a orquestracao, entao um historico longo atrasa o slot
  # das 02:00 UTC (23h BR) — preferivel a rodar em paralelo e colher HTTP 409.
  PIPELINE_DEADLINE_MIN: "150"

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    concurrency:
      # Mesmo grupo dos outros workflows: o historico das 22h BR frequentemente
      # ainda esta rodando quando a orquestracao das 23h BR comeca, e ambos
      # escrevem na mesma planilha (colisao -> HTTP 409).
      group: esteira-planilha
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar pipeline de histórico (22h BRT)
        shell: bash
        run: |
          set -Eeuo pipefail
          python -u historico_com_replicas.py 2>&1 | tee logs_historico.txt

      - name: Anexar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-historico-${{ github.run_id }}
          path: logs_historico.txt
