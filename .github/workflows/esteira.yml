name: Esteira - Orquestração

on:
  workflow_dispatch:            # botão "Run workflow"
  schedule:
    # UTC = 05, 07, 11, 17, 19 e 23h em America/Sao_Paulo (UTC-3).
    # Antes: 06/10/12/15/19/21h BR — tres slots caiam no pico de edicao da
    # planilha origem "Esteira CCM/BA - Geral", quando a Sheets API passa a
    # responder >180s com 500/409 e as tentativas se esgotam sem terminar.
    - cron: "0 8,10,14,20,22,2 * * *"

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  PYTHONPATH: .                  # ativa sitecustomize.py (timeout HTTP global)
  # 300s, nao 180s. A origem responde em ~190s quando esta sob edicao, e
  # devolve 500/503 — que os wrappers `except APIError` do repo JA tratam com
  # backoff. Cortar em 180s abortava a chamada ANTES dessa resposta e virava
  # requests.exceptions.ReadTimeout, que nenhum dos 37 wrappers pega: o script
  # morria RC=1 sem retry. Medido no run 32396124086: ciclo.py falhou 3x em
  # 363s (2x180s), contra sucesso em 1042s no run 32376629883 sem timeout.
  # O teto existe para pendura infinita, nao para cortar trabalho em curso.
  HTTP_TIMEOUT: "300"
  PIPELINE_DEADLINE_MIN: "90"    # < timeout-minutes: sai com resumo antes do kill

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      # Grupo unico para TODOS os workflows deste repo: os tres escrevem na
      # mesma planilha, e dois processos simultaneos geram HTTP 409
      # "operation was aborted". Serializar e mais lento, mas termina.
      group: esteira-planilha
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Seu script cria credenciais.json a partir do env GOOGLE_CREDENTIALS
      - name: Executar pipeline (atualizar_replicar.py)
        shell: bash                    # bash explicito => -o pipefail ativo
        run: |
          set -Eeuo pipefail
          python -u atualizar_replicar.py 2>&1 | tee logs.txt

      - name: Anexar logs
        if: always()                   # preserva log em falha/timeout
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs.txt
