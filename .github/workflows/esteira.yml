name: Esteira - Orquestração

on:
  workflow_dispatch:            # botão "Run workflow"
  schedule:
    # Horários em UTC equivalentes a 06:00, 10:00, 12:00, 15:00, 19:00, 21:00 em America/Sao_Paulo (UTC-3)
    - cron: "0 0,9,13,15,18,22 * * *"

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  PYTHONPATH: .                  # ativa sitecustomize.py (timeout HTTP global)
  # 180s, NAO 60s: a origem "Esteira CCM/BA - Geral" (5,5 MB, editada ao vivo)
  # faz chamadas legitimas levarem ~72s, e a 1a tentativa costuma chegar a ~181s.
  # Com 60s abortariamos chamadas que iam completar. O timeout aqui e teto contra
  # pendura infinita, nao acelerador.
  HTTP_TIMEOUT: "180"
  PIPELINE_DEADLINE_MIN: "90"    # < timeout-minutes: sai com resumo antes do kill

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: esteira-orquestracao
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Seu script cria credenciais.json a partir do env GOOGLE_CREDENTIALS
      - name: Executar pipeline (atualizar_replicar.py)
        shell: bash                    # bash explicito => -o pipefail ativo
        run: |
          set -Eeuo pipefail
          python -u atualizar_replicar.py 2>&1 | tee logs.txt

      - name: Anexar logs
        if: always()                   # preserva log em falha/timeout
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs.txt
